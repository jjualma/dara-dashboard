<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARA — Dashboard Eleitoral</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root{
    --vermelho:#E44027; --vinho:#2A0008; --amarelo:#EDE14A; --ciano:#98D8E0;
    --preto:#000000; --offwhite:#F0F0F0; --mostarda:#B29E36; --terracota:#902319;
    --dende:#590017;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--offwhite); color:var(--preto);
    font-family: "IBM Plex Sans","Segoe UI",Arial,sans-serif;
  }
  header{
    background:var(--dende); color:var(--offwhite); padding:22px 32px;
    display:flex; align-items:center; gap:18px; border-bottom:4px solid var(--vinho);
  }
  header img.logo{height:88px; width:auto; display:block;}
  header .header-text p{margin:2px 0 0; font-size:.9rem; color:var(--ciano); opacity:.9; font-weight:600;}
  .controls{
    display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;
    background:#fff; padding:14px 20px; border-bottom:3px solid var(--vinho);
    position:sticky; top:0; z-index:5;
  }
  .filter-group{display:flex; flex-direction:column; gap:4px;}
  .filter-group label{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--vinho);}
  select{
    font-size:.85rem; padding:6px 8px; border:2px solid var(--vinho); border-radius:5px;
    background:#fff; color:var(--vinho); font-weight:600; min-width:112px;
  }
  select:disabled{border-color:#ccc; color:#999; background:#f5f5f5; cursor:not-allowed;}
  .filter-hint{font-size:.7rem; color:#888; max-width:170px; flex-basis:100%; order:99;}
  nav.tabs{
    display:flex; flex-wrap:wrap; gap:2px; padding:12px 32px 0; background:#fff;
    border-bottom:1px solid #ddd;
  }
  nav.tabs button{
    border:none; background:none; padding:11px 16px; font-size:.85rem; font-weight:700;
    cursor:pointer; color:var(--vinho); border-bottom:3px solid transparent; opacity:.55;
    font-family:inherit; transition:opacity .15s, border-color .15s;
  }
  nav.tabs button.active{opacity:1; border-bottom-color:var(--vermelho);}
  nav.tabs button:hover{opacity:1;}
  main{padding:26px 32px 60px; max-width:1240px; margin:0 auto;}
  .fig-header{margin-bottom:10px; min-height:2.4em;}
  .fig-header h2{margin:0; font-size:1.3rem; font-weight:800; color:var(--vinho); letter-spacing:-.2px;}
  .fig-header-zone-curta{height:75px;}
  .fig-header-zone-longa{height:100px;}
  .fig-header-zone-financ-dinheiro{height:145px;}
  .fig-subtitulo{margin:0 0 6px; font-size:1.02rem; font-weight:800; color:var(--vinho);}
  .fig-note{font-size:.85rem; color:#333; line-height:1.55; margin:8px 0 0;}
  .fig-warning{font-size:.8rem; color:var(--vermelho); font-weight:700; margin:6px 0 12px;}
  .panels-row{display:flex; gap:20px; flex-wrap:wrap;}
  .panels-row-wide{display:grid; grid-template-columns:repeat(2, 1fr); gap:20px;}
  .panels-row-wide .panel-wide{min-width:0; width:100%;}
  .subtabs{display:flex; flex-wrap:wrap; gap:2px; border-bottom:1px solid #ddd; margin-bottom:16px;}
  .subtab-btn{
    border:none; background:none; padding:9px 14px; font-size:.82rem; font-weight:700;
    cursor:pointer; color:var(--vinho); border-bottom:3px solid transparent; opacity:.55;
    font-family:inherit; transition:opacity .15s, border-color .15s;
  }
  .subtab-btn.active{opacity:1; border-bottom-color:var(--vermelho);}
  .subtab-btn:hover{opacity:1;}
  .financ-duplo{display:grid; grid-template-columns:repeat(2, 1fr); gap:20px; margin-top:14px;}
  .financ-bloco{background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:14px; box-shadow:0 1px 3px rgba(42,0,8,.06); margin-top:8px;}
  .financ-bloco h4{margin:0 0 8px; font-size:.85rem; font-weight:700; color:var(--vinho);}
  .financ-bloco-solo{max-width:560px; margin-left:auto; margin-right:auto;}
  .panel{background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:12px 10px 6px; box-shadow:0 1px 3px rgba(42,0,8,.06);}
  .panel h4{margin:0 0 4px; text-align:center; font-size:.9rem; font-weight:700; color:var(--vinho);}
  svg{width:100%; height:auto; display:block;}
  .legend{display:flex; flex-wrap:wrap; gap:14px; margin:16px 0 28px; align-items:center;}
  .legend-item{display:flex; align-items:center; gap:5px; font-size:.82rem; color:#333; white-space:nowrap; flex-shrink:0;}
  .legend-swatch{width:15px; height:14px; display:inline-block; border-radius:3px;}
  .legend-gender-note{font-weight:700; color:var(--vinho);}
  footer{padding:24px 32px 40px; font-size:.78rem; color:var(--terracota); text-align:center; opacity:.75;}
  section.fig-panel{display:none;}
  section.fig-panel.active{display:block;}

  .map-controls{
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:10px 14px; margin-bottom:16px;
  }
  .play-btn{
    background:var(--vinho); color:var(--offwhite); border:none; border-radius:6px;
    padding:8px 16px; font-weight:700; font-size:.82rem; cursor:pointer; font-family:inherit;
  }
  .play-btn:hover{background:#3a0010;}
  .map-year-label{font-weight:800; font-size:1.1rem; color:var(--vermelho); min-width:52px;}
  .year-buttons{display:flex; gap:4px; align-items:center; flex-wrap:wrap;}
  .year-btn{
    border:1.5px solid var(--vinho); background:#fff; color:var(--vinho); border-radius:5px;
    padding:6px 11px; font-size:.82rem; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .year-btn.active{background:var(--vinho); color:var(--offwhite);}
  .gender-toggle{display:flex; gap:4px; align-items:center;}
  .gender-toggle-label{font-size:.82rem; font-weight:700; color:var(--vinho); margin-right:2px;}
  .gender-btn{
    border:1.5px solid var(--ciano); background:#fff; color:var(--vinho); border-radius:5px;
    padding:6px 11px; font-size:.82rem; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .gender-btn.active{background:var(--ciano); color:var(--vinho);}

  .map-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:16px;}
  .map-cell{
    background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:10px;
    position:relative; box-shadow:0 1px 3px rgba(42,0,8,.06);
  }
  .map-cell h4{margin:0 0 4px; text-align:center; font-size:.88rem; font-weight:800;}
  .map-legend-svg{width:100%; height:auto; margin-top:2px;}
  .map-tooltip{
    position:absolute; display:none; background:var(--vinho); color:var(--offwhite);
    font-size:.78rem; padding:7px 9px; border-radius:6px; pointer-events:none; z-index:10;
    line-height:1.4; white-space:nowrap;
  }
  .map-shared-legend{display:flex; gap:22px; flex-wrap:wrap; margin-top:14px; padding:10px 14px; background:#fff; border:1px solid #e6e6e6; border-radius:10px;}
  .map-shared-legend-item{font-size:.85rem; color:#333;}
  .map-shared-legend-item strong{color:var(--vinho); font-weight:800;}
  .sem-dado-placeholder{
    display:flex; align-items:center; justify-content:center; min-height:180px;
    color:#999; font-size:.85rem; font-weight:600; text-align:center; padding:20px;
    border:2px dashed #ddd; border-radius:8px; background:#fafafa;
  }
  .racechart-wrap{background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:14px; box-shadow:0 1px 3px rgba(42,0,8,.06);}
  .stackbar-wrap{display:flex; flex-direction:column; gap:20px; margin-top:20px;}
  .stackbar-block{background:#fff; border:1px solid #e6e6e6; border-radius:10px; padding:14px; box-shadow:0 1px 3px rgba(42,0,8,.06);}
  .stackbar-title{margin:0 0 10px; font-size:.9rem; font-weight:700; color:var(--vinho);}
  .race-value{font-variant-numeric:tabular-nums;}

  /* --- responsivo: tablet --- */
  @media (max-width: 900px) {
    main{padding:18px 16px 40px;}
    .controls{padding:12px 16px; gap:8px;}
    select{min-width:100px; font-size:.82rem;}
    .panels-row-wide{grid-template-columns:1fr;}
    .financ-duplo{grid-template-columns:1fr;}
    nav.tabs{padding:10px 16px 0;}
    .subtabs{padding:0;}
  }
  /* --- responsivo: celular --- */
  @media (max-width: 560px) {
    header{padding:16px 16px; gap:12px;}
    header img.logo{height:56px;}
    .controls{position:static;} /* sticky em tela pequena cobre espaço demais */
    .filter-group{flex:1 1 45%;}
    select{width:100%; min-width:0;}
    .fig-header h2{font-size:1.08rem;}
    .fig-header-zone-curta{height:auto; min-height:60px;}
    .fig-header-zone-longa{height:auto; min-height:90px;}
    .fig-header-zone-financ-dinheiro{height:auto; min-height:130px;}
    .subtab-btn{padding:8px 10px; font-size:.76rem;}
    nav.tabs button{padding:9px 11px; font-size:.78rem;}
  }
</style>
</head>
<body>

<header>
  <img src="assets/dara-logo-giz.png" alt="DARA — Dados e Análises do Racismo e do Antirracismo" class="logo">
  <div class="header-text">
    <p>Dashboard Eleitoral · daradados.com.br</p>
  </div>
</header>

<div class="controls">
  <div class="filter-group">
    <label for="cargoSelect">Cargo</label>
    <select id="cargoSelect"></select>
  </div>
  <div class="filter-group">
    <label for="regiaoSelect">Região</label>
    <select id="regiaoSelect"></select>
  </div>
  <div class="filter-group">
    <label for="ufSelect">UF</label>
    <select id="ufSelect"></select>
  </div>
  <div class="filter-group">
    <label for="municipioSelect">Município</label>
    <select id="municipioSelect" disabled><option>Selecione Vereador/Prefeito</option></select>
  </div>
  <div class="filter-group">
    <label for="capitalSelect">Capital</label>
    <select id="capitalSelect" disabled><option>Selecione Vereador/Prefeito</option></select>
  </div>
  <div class="filter-group">
    <label for="partidoSelect">Partido</label>
    <select id="partidoSelect"></select>
  </div>
  <div class="filter-hint">Município e Capital ficam disponíveis pra cargos municipais (Vereador/Prefeito).</div>
</div>

<nav class="tabs" id="tabs"></nav>

<main id="main"></main>

<footer>
  DARA — Dados e Análises do Racismo e do Antirracismo · daradados.com.br
</footer>

<script src="js/colors.js"></script>
<script src="js/fig1.js"></script>
<script src="js/fig2.js"></script>
<script src="js/fig9.js"></script>
<script src="js/fig_partido_composicao.js"></script>
<script src="js/fig_financiamento.js"></script>
<script>
const FIGURAS = [
  { id: "fig1", tab: "Perfil Geral", titulo: "Perfil Geral: de candidatura a eleito, por raça e gênero" },
  { id: "fig2", tab: "Visão por Estado", titulo: "Visão por Estado: Razão de Representação Racial" },
  { id: "figPartidoComposicao", tab: "Composição Partidária", titulo: "Composição Partidária: raça e gênero por partido" },
  { id: "fig9", tab: "Partidos em Contraste", titulo: "Partidos em Contraste: posição racial e de gênero por partido" },
  { id: "figFinanciamento", tab: "Financiamento", titulo: "Financiamento de Campanha: gênero e raça" },
];

const tabsEl = d3.select("#tabs");
const mainEl = d3.select("#main");
const cargoSelect = d3.select("#cargoSelect");
const regiaoSelect = d3.select("#regiaoSelect");
const ufSelect = d3.select("#ufSelect");
const municipioSelect = d3.select("#municipioSelect");
const capitalSelect = d3.select("#capitalSelect");
const partidoSelect = d3.select("#partidoSelect");

cargoSelect.selectAll("option").data(CARGOS_ORDEM).join("option")
  .attr("value", d => d).text(d => d);
cargoSelect.property("value", "Deputado Federal");

regiaoSelect.selectAll("option").data(["Todos", ...REGIAO_ORDEM]).join("option")
  .attr("value", d => d).text(d => d);

ufSelect.selectAll("option").data(["Todos", ...UF_ORDEM]).join("option")
  .attr("value", d => d).text(d => d);

// Lista de partidos: lida de todos os base_completa_{cargo}.json (não fixa — cresce
// sozinha conforme novos partidos aparecerem no pipeline real). Junta todos os
// cargos pra nenhum partido ficar de fora quando trocar de cargo depois.
async function popularPartidos() {
  const cargos = Object.keys(CARGO_ARQUIVO);
  const partes = await Promise.all(cargos.map(c => loadBaseCompleta(c)));
  const partidos = [...new Set(partes.flat().map(d => d.partido))].sort((a, b) => a.localeCompare(b, "pt-BR"));
  partidoSelect.selectAll("option").data(["Todos", ...partidos]).join("option")
    .attr("value", d => d).text(d => d);
}

tabsEl.selectAll("button").data(FIGURAS).join("button")
  .attr("data-id", d => d.id)
  .text(d => d.tab)
  .on("click", (ev, d) => showTab(d.id));

FIGURAS.forEach(f => {
  const sec = mainEl.append("section").attr("class", "fig-panel").attr("id", "panel-" + f.id);
  const head = sec.append("div").attr("class", "fig-header");
  head.append("h2").text(f.titulo);
  sec.append("div").attr("class", "fig-body");
});

let currentTab = "fig1";
let anoCompartilhado = null; // ano selecionado, compartilhado entre filtros dentro da mesma aba

async function updateMunicipioState() {
  const cargo = cargoSelect.property("value");
  const uf = ufSelect.property("value");
  const municipal = CARGOS_MUNICIPAIS.has(cargo);
  const temUF = uf && uf !== "Todos";

  municipioSelect.property("disabled", !(municipal && temUF));
  municipioSelect.html("");
  if (municipal && temUF) {
    const geo = await loadJSON(`data/geo/municipios/${uf}.json`);
    const cidades = geo.features.map(f => ({ id: f.properties.id, nome: f.properties.name }))
      .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
    municipioSelect.append("option").attr("value", "Todos").text("Todos");
    municipioSelect.selectAll("option.cidade").data(cidades).join("option")
      .attr("class", "cidade").attr("value", d => d.id).text(d => d.nome);
  } else {
    municipioSelect.append("option").text(municipal ? "Selecione uma UF" : "Selecione Vereador/Prefeito");
  }
  atualizarCapitalState();
}

// Só ajusta o dropdown de Capital de acordo com o valor atual de Município — não
// reconstrói a lista de município (senão o próprio clique em Município reseta a
// seleção de volta pra "Todos" antes de terminar de processar a mudança).
function atualizarCapitalState() {
  const cargo = cargoSelect.property("value");
  const uf = ufSelect.property("value");
  const municipal = CARGOS_MUNICIPAIS.has(cargo);
  const temUF = uf && uf !== "Todos";
  const municipioEspecifico = municipal && temUF && !municipioSelect.property("disabled") && municipioSelect.property("value") !== "Todos";

  capitalSelect.property("disabled", !(municipal && temUF) || municipioEspecifico);
  capitalSelect.html("");
  if (municipal && temUF && !municipioEspecifico) {
    capitalSelect.selectAll("option").data(["Todos", "Sim", "Não"]).join("option").attr("value", d => d).text(d => d);
  } else {
    capitalSelect.append("option").text(municipioEspecifico ? "Já é 1 cidade só" : "Selecione uma UF");
  }
}

function updateCargoOptions() {
  // Presidente não tem dado na Razão de Representação (eleição nacional, não por UF)
  // — escondido só nessa aba, continua disponível nas outras. Financiamento só
  // existe pros 5 cargos de eleição geral (2018/2022/2026) — Prefeito/Vereador são
  // eleição municipal (2016/2020/2024), fora do escopo dessa aba.
  const opcoes = currentTab === "fig2" ? CARGOS_ORDEM.filter(c => c !== "Presidente")
    : currentTab === "figFinanciamento" ? DaraFigs.figFinanciamento.CARGOS_FINANCIAMENTO
    : CARGOS_ORDEM;
  const atual = cargoSelect.property("value");
  cargoSelect.selectAll("option").data(opcoes).join("option")
    .attr("value", d => d).text(d => d);
  cargoSelect.property("value", opcoes.includes(atual) ? atual : (opcoes.includes("Deputado Federal") ? "Deputado Federal" : opcoes[0]));
}

async function showTab(id) {
  currentTab = id;
  tabsEl.selectAll("button").classed("active", d => d.id === id);
  mainEl.selectAll("section.fig-panel").classed("active", function () { return this.id === "panel-" + id; });
  updateCargoOptions();
  await updateMunicipioState();
  // troca de aba sempre volta pro primeiro ano disponível do cargo atual — os
  // outros filtros (UF, Região, Partido...) continuam como estavam.
  const anosCargo = CARGO_ANOS[cargoSelect.property("value")] || [];
  anoCompartilhado = anosCargo[0] || null;
  renderCurrent();
}

function currentFiltros() {
  return {
    regiao: regiaoSelect.property("value"),
    uf: ufSelect.property("value"),
    partido: partidoSelect.property("value"),
    municipio: municipioSelect.property("disabled") ? null : municipioSelect.property("value"),
    capital: capitalSelect.property("disabled") ? null : capitalSelect.property("value"),
    // ano fica igual ao trocar filtro dentro da mesma aba; só reseta ao trocar de aba
    // (showTab) — cada figura lê anoInicial e avisa via onAnoChange quando o usuário
    // troca de ano manualmente ou o play avança, pra não perder a posição depois.
    anoInicial: anoCompartilhado,
    onAnoChange: (ano) => { anoCompartilhado = ano; },
  };
}

function renderCurrent() {
  const cargo = cargoSelect.property("value");
  const f = FIGURAS.find(x => x.id === currentTab);
  const body = mainEl.select("#panel-" + currentTab + " .fig-body");
  window.DaraFigs[f.id].render(body, cargo, currentFiltros());
}

cargoSelect.on("change", async () => {
  await updateMunicipioState();
  const anosCargo = CARGO_ANOS[cargoSelect.property("value")] || [];
  if (!anosCargo.includes(anoCompartilhado)) anoCompartilhado = anosCargo[0] || null;
  renderCurrent();
});
function popularUFs() {
  const regiao = regiaoSelect.property("value");
  const ufsValidas = (regiao && regiao !== "Todos") ? UF_ORDEM.filter(uf => UF_REGIAO[uf] === regiao) : UF_ORDEM;
  const ufAtual = ufSelect.property("value");
  ufSelect.selectAll("option").data(["Todos", ...ufsValidas]).join("option")
    .attr("value", d => d).text(d => d);
  // se a UF selecionada não pertence mais à região escolhida, volta pra "Todos"
  ufSelect.property("value", ufsValidas.includes(ufAtual) ? ufAtual : "Todos");
}

regiaoSelect.on("change", async () => { popularUFs(); await updateMunicipioState(); renderCurrent(); });
ufSelect.on("change", async () => {
  const uf = ufSelect.property("value");
  // escolher uma UF direto já ajusta a Região correspondente, pra nunca ficar
  // uma combinação impossível tipo Região=Sul + UF=RJ. Voltar UF pra "Todos"
  // também zera a Região (senão fica preso na região do último UF escolhido).
  if (uf && uf !== "Todos") regiaoSelect.property("value", UF_REGIAO[uf]);
  else regiaoSelect.property("value", "Todos");
  await updateMunicipioState();
  renderCurrent();
});
municipioSelect.on("change", () => { atualizarCapitalState(); renderCurrent(); });
capitalSelect.on("change", renderCurrent);
partidoSelect.on("change", renderCurrent);

updateMunicipioState().then(() => popularPartidos()).finally(() => showTab("fig1"));
</script>
</body>
</html>
